<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>철거의정석 업무보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" />
<style>
:root{
  --ground:#f1f0ec; --surface:#ffffff; --surface-2:#f6f5f1; --ink:#15140f; --ink-2:#3f3c36; --ink-3:#66625b;
  --line:#d6d3cb; --line-2:#e7e4dd; --bar:#14171c; --bar-ink:#ffffff; --bar-muted:#c3c8cf;
  --brand:#c8102e; --brand-ink:#ffffff; --brand-soft:#fbe9ec; --brand-soft-ink:#8e0b21;
  --accent:#f3b71f; --accent-soft:#fdf3d6; --accent-soft-ink:#6f4f00;
  --st-todo:#4b5563; --st-todo-bg:#e6e9ee; --st-doing:#1d4fa8; --st-doing-bg:#dce8fb;
  --st-review:#9a4a00; --st-review-bg:#fde7c4; --st-done:#166b3f; --st-done-bg:#d4f0df; --st-returned:#a61b1b; --st-returned-bg:#fbdcdc;
  --focus:#2563c9; --todo-band:#e3efe6; --shadow:0 1px 2px rgba(20,18,12,.06),0 8px 24px rgba(20,18,12,.06);
  --radius:10px; --maxw:1180px; --font:'IBM Plex Sans KR','Pretendard','Noto Sans KR',-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101216; --surface:#1e2127; --surface-2:#262a31; --ink:#f3f1ec; --ink-2:#cfcbc3; --ink-3:#a39f97;
    --line:#3a3f49; --line-2:#2e323b; --bar:#0a0c0f; --bar-ink:#ffffff; --bar-muted:#c3c8cf;
    --brand:#ff5c70; --brand-ink:#ffffff; --brand-soft:#4a1d26; --brand-soft-ink:#ffb3bd;
    --accent:#ffc83d; --accent-soft:#3f3410; --accent-soft-ink:#ffe08a;
    --st-todo:#c4c9d3; --st-todo-bg:#343943; --st-doing:#9dbcff; --st-doing-bg:#22365c;
    --st-review:#ffc078; --st-review-bg:#4a3414; --st-done:#8fe3b4; --st-done-bg:#1b4a30; --st-returned:#ff9d9d; --st-returned-bg:#54201f;
    --focus:#7aa6ff; --todo-band:#1f2d24; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#101216; --surface:#1e2127; --surface-2:#262a31; --ink:#f3f1ec; --ink-2:#cfcbc3; --ink-3:#a39f97;
  --line:#3a3f49; --line-2:#2e323b; --bar:#0a0c0f; --bar-ink:#ffffff; --bar-muted:#c3c8cf;
  --brand:#ff5c70; --brand-ink:#ffffff; --brand-soft:#4a1d26; --brand-soft-ink:#ffb3bd;
  --accent:#ffc83d; --accent-soft:#3f3410; --accent-soft-ink:#ffe08a;
  --st-todo:#c4c9d3; --st-todo-bg:#343943; --st-doing:#9dbcff; --st-doing-bg:#22365c;
  --st-review:#ffc078; --st-review-bg:#4a3414; --st-done:#8fe3b4; --st-done-bg:#1b4a30; --st-returned:#ff9d9d; --st-returned-bg:#54201f;
  --focus:#7aa6ff; --todo-band:#1f2d24; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:15px;line-height:1.55;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:13px;color:var(--ink-2);font-weight:600;letter-spacing:.02em;background:var(--surface-2)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bar);color:var(--bar-ink)}
.topbar-inner{max-width:var(--maxw);margin:0 auto;padding:0 16px;min-height:58px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
@media (max-width:760px){.topbar-inner{padding-block:8px 0;gap:8px}.logo > span:last-child{display:none}.pill-btn{padding:6px 10px;font-size:13.5px}.top-actions{gap:6px}.top-actions select{max-width:118px;padding:6px 6px;font-size:13.5px}.nav{order:3;flex-basis:100%;margin-inline:-16px;padding-inline:16px;border-top:1px solid rgba(255,255,255,.08)}.top-actions{margin-left:auto}}
.logo{font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.logo span{color:var(--accent)}
.nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;border:0;color:var(--bar-muted);padding:10px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:15px;position:relative}
.nav button:hover{color:var(--bar-ink);background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{color:var(--bar-ink);background:rgba(255,255,255,.14)}.nav button[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:3px;height:3px;border-radius:2px;background:var(--accent)}
.top-actions{display:flex;align-items:center;gap:8px;white-space:nowrap}
.top-actions select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:var(--bar-ink);border-radius:8px;padding:7px 8px;max-width:150px;font-weight:600}
.pill-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);color:var(--bar-ink);border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:600}
.pill-btn:hover{background:rgba(255,255,255,.18)}
.pill-btn.on{background:var(--accent);color:#1c1b19;border-color:var(--accent)}

/* layout */
.page{max-width:var(--maxw);margin:0 auto;padding-block:22px 60px;padding-inline:16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{font-size:24px;letter-spacing:-.01em}
.page-head .sub{color:var(--ink-2);font-size:14px;margin-top:3px}
.section{margin-top:26px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.section-head h2{font-size:17px;display:flex;align-items:center;gap:8px}
.section-head h2::before{content:"";width:3px;height:16px;background:var(--brand);border-radius:2px}
.section-head .meta{color:var(--ink-3);font-size:13.5px;font-weight:500}
.grid-2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
@media (max-width:860px){.grid-2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.card-pad{padding:16px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--st-doing);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--ink-3)}
.kpi .k{font-size:14px;color:var(--ink-2);font-weight:600}
.kpi .v{font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .d{font-size:13px;color:var(--ink-3)}
.kpi.warn{border-top-color:var(--st-returned)}.kpi.warn .v{color:var(--st-returned)}
.kpi.att{border-top-color:var(--st-review)}.kpi.att .v{color:var(--st-review)}
.kpi.ok{border-top-color:var(--st-done)}
.kpi.lead{border-top-color:var(--accent)}

/* chips & badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st-todo{background:var(--st-todo-bg);color:var(--st-todo)}
.st-doing{background:var(--st-doing-bg);color:var(--st-doing)}
.st-review{background:var(--st-review-bg);color:var(--st-review)}
.st-done{background:var(--st-done-bg);color:var(--st-done)}
.st-returned{background:var(--st-returned-bg);color:var(--st-returned)}
.type-tag{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:5px;font-weight:500}
.pri-high{color:var(--brand);font-weight:700;font-size:13px}
.late{color:var(--st-returned);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;color:var(--ink-2);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* task list */
.tasks{display:flex;flex-direction:column;gap:10px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px 14px}
.task.review{border-left:5px solid var(--st-review)}
.task.returned{border-left:5px solid var(--st-returned)}
.task.doing{border-left:5px solid var(--st-doing)}
.task .t-title{font-weight:700;font-size:17px;cursor:pointer;line-height:1.35}
.task .t-title:hover{text-decoration:underline}
.task .t-meta{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--ink-2);margin-top:8px}
.task .t-actions{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.task .t-report{grid-column:1/-1;background:var(--surface-2);border-left:3px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--ink);line-height:1.5}
.task .t-report b{color:var(--ink-3);font-weight:600;margin-right:4px}
.quick{grid-column:1/-1;display:flex;gap:8px}
.quick input{flex:1}
@media (max-width:600px){.task{grid-template-columns:1fr}.task .t-actions{justify-content:flex-start}.quick{flex-direction:column}.quick .btn{width:100%}}
.group-title{font-weight:700;font-size:16px;margin:18px 0 8px;display:flex;align-items:baseline;gap:8px}
.group-title small{color:var(--ink-3);font-weight:500;font-size:14px}

/* buttons & forms */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{filter:brightness(.93)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 11px;font-size:13.5px}
.btn-ok{background:var(--st-done-bg);color:var(--st-done);border-color:transparent}
.btn-warn{background:var(--st-returned-bg);color:var(--st-returned);border-color:transparent}
input[type=text],input[type=number],input[type=url],input[type=date],input[type=tel],input[type=password],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:70px}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px}
.field > span{color:var(--ink-2);font-size:13.5px;font-weight:500}
.field.req > span::after{content:" *";color:var(--brand)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.check input{width:16px;height:16px}

/* activity */
.feed{display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:14.5px;line-height:1.5}
.feed li:last-child{border-bottom:0}
.feed .t{color:var(--ink-3);font-size:13px;padding-top:2px;font-weight:500}
.feed .who{font-weight:700}
.feed .k{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--st-todo)}
.feed .k.fk-submit{background:var(--st-review)}.feed .k.fk-approve{background:var(--st-done)}.feed .k.fk-return{background:var(--st-returned)}.feed .k.fk-assign{background:var(--st-doing)}.feed .k.fk-lead{background:var(--accent)}
.empty{color:var(--ink-3);font-size:14px;padding:20px;text-align:center}

/* leads */
.pipeline{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.stage{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:120px}
.stage h3{font-size:14px;color:var(--ink);display:flex;justify-content:space-between;margin-bottom:8px;font-weight:700}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:8px;font-size:14px}
.lead .n{font-weight:700;font-size:15px}
.lead .m{color:var(--ink-2);font-size:13px;margin:3px 0 8px;line-height:1.5}
.lead select{padding:4px 6px;font-size:12px}
.lead .row{display:flex;gap:6px}

/* notices & misc */
.notice{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.notice:last-child{border-bottom:0}
.notice .date{margin-left:auto;color:var(--ink-3);font-size:13px}
.pin{background:var(--brand-soft);color:var(--brand-soft-ink);font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:4px}
.notif-log li{padding:11px 0;border-bottom:1px solid var(--line-2);font-size:14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.notif-log li:last-child{border-bottom:0}
.notif-log .ch{font-size:12.5px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.notif-log .st{font-size:13px;font-weight:600;white-space:nowrap}
.notif-log .st.sent{color:var(--st-done)}.notif-log .st.failed{color:var(--st-returned)}.notif-log .st.preview{color:var(--ink-3)}
.notif-log .body{color:var(--ink-2);white-space:pre-wrap;font-size:13.5px;line-height:1.5}
.notif-log .body b{color:var(--ink)}
.tbl-wrap{overflow-x:auto}
.up{color:var(--st-done)}.down{color:var(--st-returned)}.flat{color:var(--ink-3)}
.help{font-size:13.5px;color:var(--ink-2);background:var(--accent-soft);color:var(--accent-soft-ink);padding:10px 12px;border-radius:8px;line-height:1.5}
.help code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.rule{border-top:1px solid var(--line);margin:18px 0}

/* design tab */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:stretch}
@media (max-width:860px){.flow{grid-template-columns:1fr}}
.flow .node{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;font-size:14px;position:relative}
.flow .node b{display:block;font-size:15px;margin-bottom:5px}
.flow .node small{color:var(--ink-2);display:block;line-height:1.45}
.flow .node.hot{border-color:var(--brand);background:var(--brand-soft)}
.flow .node.hot small{color:var(--brand-soft-ink)}
.roadmap li{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.roadmap li:last-child{border-bottom:0}
.roadmap .ph{font-weight:600;color:var(--brand)}
.roadmap small{color:var(--ink-2);display:block}

/* todo (notion-style) */
.todo-hero{background:var(--todo-band);border-radius:12px;padding:22px 24px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.todo-hero h1{font-size:28px;font-weight:700;letter-spacing:-.01em}
.todo-hero .ic{font-size:24px}
.todo-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.view-tab{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:15px;color:var(--ink-2)}
.view-tab[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.todo-bar .sp{flex:1}
.new-btn{background:#2f6fe4;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer}
.new-btn:hover{filter:brightness(.95)}
.todo-filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0}
.filt{display:inline-flex;align-items:center;gap:6px;background:var(--st-doing-bg);color:var(--st-doing);border:0;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.filt select{background:transparent;border:0;color:inherit;font-weight:600;padding:0;width:auto;font-size:14px}
.filt.plain{background:transparent;color:var(--ink-3);font-weight:500}
.todo-tbl{width:100%;border-collapse:collapse}
.todo-tbl th{background:transparent;color:var(--ink-3);font-weight:500;font-size:14px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.todo-tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;font-size:15.5px}
.todo-tbl tr:hover td{background:var(--surface-2)}
.todo-tbl .c-chk{width:44px;text-align:center}
.todo-tbl .c-chk input{width:20px;height:20px;accent-color:#2f6fe4;cursor:pointer;margin-top:4px}
.todo-tbl .c-st{width:110px;white-space:nowrap;padding-top:12px}
.todo-tbl .c-name{min-width:260px;width:38%}
.todo-tbl .c-desc{min-width:200px}
.todo-tbl .c-who{width:110px;white-space:nowrap;color:var(--ink-2);font-size:14px;padding-top:12px}
.todo-tbl .c-date{width:130px;white-space:nowrap}
.todo-tbl .c-open{width:110px;text-align:right;white-space:nowrap;padding-top:10px}
.cell{width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-size:15.5px;line-height:1.5;resize:none;overflow:hidden;min-height:32px;font-family:inherit;color:var(--ink)}
.todo-tbl input.cell[type=date]{border-color:transparent;background:transparent;width:auto;color:var(--ink-2)}
.cell:hover,.todo-tbl input.cell[type=date]:hover{border-color:var(--line)}
.cell:focus{border-color:var(--focus);background:var(--surface);outline:0}
.cell.desc{color:var(--ink-2);font-size:14.5px}
.todo-tbl tr.done .cell.name{color:var(--ink-3);text-decoration:line-through}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.st i{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.st.todo i{background:#2f6fe4}.st.done i{background:#22a35b;border-radius:4px}.st.late i{background:#e5322d}
.open-btn{opacity:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.todo-tbl tr:hover .open-btn,.open-btn:focus{opacity:1}
.todo-add{padding:10px;color:var(--ink-3);cursor:pointer;font-size:15px;border:0;background:transparent;width:100%;text-align:left}
.todo-add:hover{color:var(--ink)}
.todo-group{margin-top:22px}
.todo-group h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.todo-group h2 small{color:var(--ink-3);font-weight:500;font-size:14px}
.todo-summary{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-2);font-size:14px}
.todo-summary b{color:var(--ink)}
@media (max-width:700px){.todo-tbl .c-who,.todo-tbl .c-date{display:none}.todo-tbl .c-name{min-width:180px}.open-btn{opacity:1}}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,10,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:620px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}

/* ============ 상태 ============ */
var state;
function load(){try{var raw=localStorage.getItem(KEY);if(raw){var s=JSON.parse(raw);if(s&&s.version===2)return s;}}catch(e){}return seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
state=load();
window.addEventListener('storage',function(e){if(e.key===KEY){state=load();render();}});

function me(){return user(state.currentUserId);}
function user(id){for(var i=0;i<state.users.length;i++)if(state.users[i].id===id)return state.users[i];return null;}
function uname(id){var u=user(id);return u?u.name+' '+ROLE[u.role]:'미배정';}
function task(id){for(var i=0;i<state.tasks.length;i++)if(state.tasks[i].id===id)return state.tasks[i];return null;}
function lead(id){for(var i=0;i<state.leads.length;i++)if(state.leads[i].id===id)return state.leads[i];return null;}
function today(){return dayOffset(0);}
function isLate(t){return t.due<today()&&t.status!=='done';}
function isReviewer(t){var m=me();return m.role==='ceo'||m.id===t.assignerId||(m.role==='lead'&&user(t.assigneeId)&&user(t.assigneeId).role==='staff');}
function canSubmit(t){var m=me();return (m.id===t.assigneeId||m.role==='ceo')&&t.status!=='done'&&t.status!=='review';}
function fmtDate(s){return s?s.replace(/-/g,'.'):'';}
function fmtTime(isoStr){var d=new Date(isoStr);var diff=(Date.now()-d.getTime())/60000;if(diff<1)return '방금';if(diff<60)return Math.floor(diff)+'분 전';if(diff<60*24)return Math.floor(diff/60)+'시간 전';return (d.getMonth()+1)+'.'+d.getDate();}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function log(actorId,kind,text){state.activity.unshift({id:uid(),at:new Date().toISOString(),actorId:actorId,kind:kind,text:text});state.activity=state.activity.slice(0,200);}

/* ============ 알림 ============ */
function ceoId(){for(var i=0;i<state.users.length;i++)if(state.users[i].role==='ceo')return state.users[i].id;return null;}
function recipientsFor(ev){
  var r=[];var t=ev.task,l=ev.lead;
  switch(ev.type){
    case 'task.submitted':r=[t.assignerId];if(t.priority==='high'&&state.settings.notifyCeoOnHigh)r.push(ceoId());break;
    case 'task.assigned':r=[t.assigneeId];break;
    case 'task.approved':case 'task.returned':r=[t.assigneeId];break;
    case 'lead.new':r=[l.assigneeId,ceoId()];break;
    case 'lead.stage':r=[l.assigneeId];state.users.forEach(function(u){if(u.role==='lead')r.push(u.id);});break;
    case 'attendance':r=[];break;
    case 'todo.done':case 'todo.late':r=state.users.filter(function(u){return u.role==='ceo'||u.role==='lead';}).map(function(u){return u.id;});break;
    case 'todo.assigned':r=[ev.todo.assigneeId];break;
    case 'test':r=[ev.actorId];break;
  }
  var seen={};return r.filter(function(id){if(!id||id===ev.actorId&&ev.type!=='test'||seen[id])return false;seen[id]=1;return true;});
}
function buildMessage(ev){
  var a=uname(ev.actorId),t=ev.task,l=ev.lead,m={title:'',lines:[],ask:''};
  if(ev.type==='task.submitted'){m.title='📋 보고 제출 · '+a;m.lines=[t.title,'유형 '+TYPES[t.type].label+' · 마감 '+fmtDate(t.due)+' · 우선순위 '+PRI[t.priority],'최종 의견: '+t.report.summary];
    Object.keys(t.report.fields||{}).forEach(function(k){var f=fieldDef(t.type,k);if(f&&t.report.fields[k]!==''&&t.report.fields[k]!==false)m.lines.push(f.l+': '+(f.t==='check'?'예':t.report.fields[k]));});
    if(t.report.link)m.lines.push('링크: '+t.report.link);m.ask='확인 부탁드립니다 (승인/반려)';}
  else if(ev.type==='task.assigned'){m.title='🗂 업무 배정 · '+a;m.lines=[t.title,'유형 '+TYPES[t.type].label+' · 마감 '+fmtDate(t.due)+' · 우선순위 '+PRI[t.priority]];m.ask='확인 후 진행 부탁드립니다';}
  else if(ev.type==='task.approved'){m.title='✅ 승인 · '+a;m.lines=[t.title,t.review.comment?'코멘트: '+t.review.comment:''];}
  else if(ev.type==='task.returned'){m.title='↩️ 반려 · '+a;m.lines=[t.title,'사유: '+t.review.comment];m.ask='수정 후 다시 제출해 주세요';}
  else if(ev.type==='lead.new'){m.title='📞 새 문의 · '+l.source;m.lines=[l.name+' · '+l.region+' · '+l.kind,'연락처 '+l.phone,'담당 '+uname(l.assigneeId)];m.ask='30분 내 1차 연락 부탁드립니다';}
  else if(ev.type==='lead.stage'){m.title='🔁 문의 단계 변경 · '+a;m.lines=[l.name+' · '+l.region+' · '+l.kind,'단계 → '+l.stage];}
  else if(ev.type==='attendance'){m.title=(ev.inout==='in'?'🟢 출근':'⚪ 퇴근')+' · '+a;m.lines=[new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})];}
  else if(ev.type==='todo.done'){var d=ev.todo;m.title='✅ 완료 · '+a;m.lines=[d.title,d.desc?'설명: '+d.desc:'','날짜 '+fmtDate(d.date)];}
  else if(ev.type==='todo.assigned'){var d2=ev.todo;m.title='🗂 할 일 추가 · '+a;m.lines=[d2.title,d2.desc?'설명: '+d2.desc:'','날짜 '+fmtDate(d2.date)+' · 담당 '+uname(d2.assigneeId)];m.ask='확인 부탁드립니다';}
  else if(ev.type==='todo.late'){var d3=ev.todo;m.title='🔴 지남 → 오늘로 이동 · '+a;m.lines=[d3.title,'원래 날짜 '+fmtDate(ev.from)];}
  else if(ev.type==='test'){m.title='🔔 테스트 알림 · '+a;m.lines=['철거의정석 업무보드 알림 채널이 연결되었습니다.'];}
  m.lines=m.lines.filter(Boolean);return m;
}
function fieldDef(type,k){var fs=TYPES[type].fields;for(var i=0;i<fs.length;i++)if(fs[i].k===k)return fs[i];return null;}
function mentionDiscord(u){return u.discordId?'<@'+u.discordId+'>':'@'+u.name;}
function mentionTelegram(u){return u.telegramChatId?'<a href="tg://user?id='+u.telegramChatId+'">'+esc(u.name)+'</a>':'@'+esc(u.name);}

function notify(ev){
  var recips=recipientsFor(ev).map(user).filter(Boolean);
  var msg=buildMessage(ev);
  var s=state.settings;
  var plain=msg.title+'\n'+msg.lines.join('\n')+(msg.ask?'\n'+msg.ask:'');
  var channelOnly=recips.length===0;
  var wantDiscord=channelOnly||recips.some(function(u){return u.channels.indexOf('discord')>=0;});
  var wantTelegram=recips.some(function(u){return u.channels.indexOf('telegram')>=0;});
  var toNames=recips.map(function(u){return u.name;}).join(', ')||'채널';
  var jobs=[];
  if(wantDiscord){
    var mention=recips.filter(function(u){return u.channels.indexOf('discord')>=0;}).map(mentionDiscord).join(' ');
    var content=(mention?mention+' ':'')+(msg.ask||'');
    var payload={content:content.trim()||undefined,embeds:[{title:msg.title,description:msg.lines.join('\n'),color:0xc8102e,footer:{text:'철거의정석 업무보드'}}]};
    jobs.push({channel:'discord',to:toNames,text:(mention?mention+'\n':'')+plain,run:s.discordWebhook?function(){return fetch(s.discordWebhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);});}:null});
  }
  if(wantTelegram){
    var tg=recips.filter(function(u){return u.channels.indexOf('telegram')>=0;});
    var html='<b>'+esc(msg.title)+'</b>\n'+msg.lines.map(esc).join('\n')+(msg.ask?'\n'+tg.map(mentionTelegram).join(' ')+' '+esc(msg.ask):'');
    var chats=tg.map(function(u){return u.telegramChatId;}).filter(Boolean);if(!chats.length&&s.telegramChatId)chats=[s.telegramChatId];
    jobs.push({channel:'telegram',to:tg.map(function(u){return u.name;}).join(', '),text:plain,run:(s.telegramToken&&chats.length)?function(){
      return Promise.all(chats.map(function(c){return fetch('https://api.telegram.org/bot'+s.telegramToken+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:c,text:html,parse_mode:'HTML'})}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);});}));}:null});
  }
  jobs.forEach(function(j){
    var entry={id:uid(),at:new Date().toISOString(),channel:j.channel,to:j.to,text:j.text,status:j.run?'sending':'preview',error:''};
    state.notifLog.unshift(entry);state.notifLog=state.notifLog.slice(0,60);save();
    if(j.run){j.run().then(function(){entry.status='sent';}).catch(function(e){entry.status='failed';entry.error=(e&&e.message)||'전송 실패';
      if(/Failed to fetch|NetworkError|Load failed/i.test(entry.error))entry.error='브라우저에서 차단됨 (미리보기 환경은 외부 전송이 막힙니다. 파일을 직접 열거나 실제 서버에서 보내세요)';
    }).then(function(){save();render();});}
  });
  return jobs.length;
}

function scopedTasks(){var m=me();if(m.role==='staff')return state.tasks.filter(function(t){return t.assigneeId===m.id;});return state.tasks;}
function kpis(){
  var ts=scopedTasks(),td=today();
  var thisWeek=new Date();thisWeek.setDate(thisWeek.getDate()-6);
  return {
    today:ts.filter(function(t){return t.due===td&&t.status!=='done';}).length,
    review:state.tasks.filter(function(t){return t.status==='review'&&isReviewer(t);}).length,
    late:ts.filter(isLate).length,
    leads:state.leads.filter(function(l){return new Date(l.createdAt)>=thisWeek;}).length
  };
}

  if(t.status==='review'&&isReviewer(t))actions+='<button class="btn btn-ok btn-sm" data-act="approve" data-id="'+t.id+'" type="button">승인</button><button class="btn btn-warn btn-sm" data-act="return" data-id="'+t.id+'" type="button">반려</button>';
  if(t.status==='todo'&&me().id===t.assigneeId)actions+='<button class="btn btn-sm" data-act="start" data-id="'+t.id+'" type="button">시작</button>';
  actions+='<button class="btn btn-ghost btn-sm" data-act="detail" data-id="'+t.id+'" type="button">상세</button>';
  var report='';
  if(t.report&&(t.status==='review'||t.status==='done'||t.status==='returned'))report='<div class="t-report"><b>최종 의견</b> '+esc(t.report.summary)+(t.review&&t.review.comment?'<br><b>'+(t.review.decision==='approved'?'승인 코멘트':'반려 사유')+'</b> '+esc(t.review.comment):'')+'</div>';
  var quick='';
  if(opts.quick&&canSubmit(t))quick='<form class="quick" data-quick="'+t.id+'"><input type="text" id="q-'+t.id+'" placeholder="최종 의견 한 줄을 적고 제출 → 상세 항목 입력 창이 열립니다" aria-label="최종 의견"><button class="btn btn-primary" type="submit">제출</button></form>';
  return '<li class="task '+t.status+'">'+
    '<div><div class="t-title" data-act="detail" data-id="'+t.id+'">'+esc(t.title)+'</div>'+
    '<div class="t-meta"><span class="badge st-'+t.status+'">'+STATUS[t.status]+'</span><span class="type-tag">'+TYPES[t.type].label+'</span>'+
    (t.priority==='high'?'<span class="pri-high">우선순위 높음</span>':'')+

    (t.client?'<span>· '+esc(t.client)+'</span>':'')+'</div></div>'+
    '<div class="t-actions">'+actions+'</div>'+report+quick+'</li>';
}

/* ============ 할 일 (노션 스타일) ============ */
function todoStatus(d){if(d.done)return 'done';if(d.date<today())return 'late';return 'todo';}
function todoStatusLabel(st){return {todo:'할 일',done:'완료',late:'지남'}[st];}
function todoById(id){for(var i=0;i<state.todos.length;i++)if(state.todos[i].id===id)return state.todos[i];return null;}
function weekStart(){var d=new Date();d.setHours(12,0,0,0);var day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return iso(d);}
function viewTodos(){
  var ui=state.ui,view=ui.todoView||'today',who=ui.todoWho||'all',m=me();
  var T=today(),Y=dayOffset(-1),W=weekStart();
  var all=state.todos.filter(function(d){return who==='all'||d.assigneeId===who;});
  var rows=all.filter(function(d){
    if(view==='today')return d.date===T;if(view==='yesterday')return d.date===Y;if(view==='week')return d.date>=W&&d.date<=T;
    if(view==='late')return d.date<T&&!d.done;return true;});
  rows.sort(function(a,b){var o={late:0,todo:1,done:2},sa=o[todoStatus(a)],sb=o[todoStatus(b)];if(sa!==sb)return sa-sb;return a.createdAt<b.createdAt?-1:1;});
  var done=rows.filter(function(d){return d.done;}).length,late=all.filter(function(d){return d.date<T&&!d.done;}).length;
  var views=[['today','Today'],['yesterday','어제'],['week','이번 주'],['late','지남'+(late?' '+late:'')],['all','전체']];
  var h='<div class="todo-hero"><span class="ic">☑</span><h1>Todo List</h1></div>';
  h+='<div class="todo-bar">'+views.map(function(v){return '<button class="view-tab" type="button" data-todo-view="'+v[0]+'" aria-pressed="'+(view===v[0])+'">'+(v[0]==='late'?'🔴':'✓')+' '+v[1]+'</button>';}).join('')+'<span class="sp"></span><button class="new-btn" type="button" data-act="todo-new">새로 만들기</button></div>';
  h+='<div class="todo-filters"><span class="filt">📅 날짜: '+{today:'오늘',yesterday:'어제',week:'이번 주',late:'지난 일 · 미완료',all:'전체'}[view]+'</span><label class="filt">👤 <select data-todo-who aria-label="담당자"><option value="all"'+(who==='all'?' selected':'')+'>모두</option>'+state.users.map(function(u){return '<option value="'+u.id+'"'+(who===u.id?' selected':'')+'>'+esc(u.name)+' '+ROLE[u.role]+'</option>';}).join('')+'</select></label><span class="filt plain">+ 필터</span><span style="flex:1"></span>'+
    (view==='late'&&rows.length?'<button class="btn btn-sm" type="button" data-act="todo-carry-all">미완료 전부 오늘로 옮기기</button>':'')+
    '<span class="todo-summary">'+(rows.length?'<span><b>'+done+'</b> / '+rows.length+' 완료</span>':'')+(late&&view!=='late'?'<span class="late">지남 '+late+'건</span>':'')+'</span></div>';
  function table(list,groupWho){
    if(!list.length)return '<div class="empty">항목이 없습니다. 「새로 만들기」로 추가하세요.</div>';
    return '<div class="tbl-wrap"><table class="todo-tbl"><thead><tr><th class="c-chk">완</th><th class="c-st">완료 여부</th><th class="c-name">Aa 이름</th><th class="c-desc">≡ 설명</th>'+(groupWho?'':'<th class="c-who">담당</th>')+'<th class="c-date">날짜</th><th class="c-open"></th></tr></thead><tbody>'+
      list.map(function(d){var st=todoStatus(d);var u=user(d.assigneeId);return '<tr class="'+st+'" data-todo-row="'+d.id+'"><td class="c-chk"><input type="checkbox" data-todo-chk="'+d.id+'" aria-label="완료"'+(d.done?' checked':'')+'></td>'+
        '<td class="c-st"><span class="st '+st+'"><i></i>'+todoStatusLabel(st)+'</span></td>'+
        '<td class="c-name"><textarea class="cell name" rows="1" data-todo-field="title" data-todo="'+d.id+'" placeholder="이름" aria-label="이름">'+esc(d.title)+'</textarea></td>'+
        '<td class="c-desc"><textarea class="cell desc" rows="1" data-todo-field="desc" data-todo="'+d.id+'" placeholder="설명" aria-label="설명">'+esc(d.desc)+'</textarea></td>'+
        (groupWho?'':'<td class="c-who">'+esc(u?u.name+' '+ROLE[u.role]:'미배정')+'</td>')+
        '<td class="c-date"><input type="date" class="cell" style="padding:2px 4px;font-size:14px" data-todo-field="date" data-todo="'+d.id+'" value="'+d.date+'" aria-label="날짜"></td>'+
        '<td class="c-open">'+(st==='late'?'<button class="open-btn" type="button" data-act="todo-carry" data-id="'+d.id+'" title="오늘로 옮기기">→ 오늘</button> ':'')+'<button class="open-btn" type="button" data-act="todo-open" data-id="'+d.id+'">열기</button></td></tr>';}).join('')+
      '</tbody></table></div>';
  }
  if(who==='all'&&view!=='all'){
    var order=state.users.slice().sort(function(a,b){var o={ceo:0,lead:1,staff:2};return o[a.role]-o[b.role];});
    order.forEach(function(u){var list=rows.filter(function(d){return d.assigneeId===u.id;});if(!list.length&&u.role==='staff')return;
      h+='<div class="todo-group"><h2>'+esc(u.name)+' '+ROLE[u.role]+' <small>'+list.filter(function(d){return d.done;}).length+' / '+list.length+'</small></h2>'+table(list,true)+'<button class="todo-add" type="button" data-act="todo-new" data-who="'+u.id+'">+ 새 페이지</button></div>';});
  }else{
    h+='<div class="todo-group">'+table(rows,who!=='all')+'<button class="todo-add" type="button" data-act="todo-new" data-who="'+(who==='all'?m.id:who)+'">+ 새 페이지</button></div>';
  }
  return h;
}
function todoDefaultDate(){return state.ui.todoView==='yesterday'?dayOffset(-1):today();}
function todoNew(whoId){var m=me();var d={id:uid(),title:'',desc:'',assigneeId:whoId||(state.ui.todoWho!=='all'?state.ui.todoWho:m.id),date:todoDefaultDate(),done:false,doneAt:null,createdBy:m.id,createdAt:new Date().toISOString()};
  state.todos.push(d);save();render();var el=document.querySelector('textarea[data-todo="'+d.id+'"][data-todo-field="title"]');if(el){el.focus();el.scrollIntoView({block:'center'});}}
function todoOpen(id){var d=todoById(id);var st=todoStatus(d);
  openModal('<div class="modal-h"><h3>'+esc(d.title||'(제목 없음)')+'</h3><button class="x" type="button" data-close="1" aria-label="닫기">×</button></div><form id="todo-form" data-id="'+id+'"><div class="modal-b"><div class="form-grid">'+

var modalRoot=document.getElementById('modal-root');

function toast(msg){var r=document.getElementById('toast-root');r.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(r._t);r._t=setTimeout(function(){r.innerHTML='';},2800);}

function fieldHtml(f,val){
  var v=val==null?'':val;
  if(f.t==='check')return '<label class="check full"><input type="checkbox" id="f-'+f.k+'" name="'+f.k+'"'+(v?' checked':'')+'> '+esc(f.l)+'</label>';
  if(f.t==='select')return '<label class="field'+(f.req?' req':'')+'"><span>'+esc(f.l)+'</span><select id="f-'+f.k+'" name="'+f.k+'"'+(f.req?' required':'')+'><option value="">선택</option>'+f.opts.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select></label>';
  return '<label class="field'+(f.req?' req':'')+(f.t==='url'?' full':'')+'"><span>'+esc(f.l)+'</span><input type="'+f.t+'" id="f-'+f.k+'" name="'+f.k+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"'+(f.req?' required':'')+'></label>';
}

function doSubmit(id,summary,fields,link){
  var t=task(id),m=me();
  t.report={summary:summary,fields:fields,link:link,submittedAt:new Date().toISOString()};t.status='review';t.review=null;
  log(m.id,'submit','「'+t.title+'」 보고 제출 → '+uname(t.assignerId)+' 검토 대기');
  var n=notify({type:'task.submitted',task:t,actorId:m.id});
  save();closeModal();render();toast('제출 완료. '+(n?uname(t.assignerId)+'에게 알림을 보냈습니다.':'알림 대상이 없습니다.'));
}
function doReview(id,decision,comment){
  var t=task(id),m=me();
  t.review={by:m.id,decision:decision,comment:comment,at:new Date().toISOString()};t.status=decision==='approved'?'done':'returned';
  log(m.id,decision==='approved'?'approve':'return','「'+t.title+'」 '+(decision==='approved'?'승인':'반려')+(comment?' — '+comment:''));
  notify({type:decision==='approved'?'task.approved':'task.returned',task:t,actorId:m.id});
  save();closeModal();render();toast((decision==='approved'?'승인':'반려')+' 처리. '+uname(t.assigneeId)+'에게 알림을 보냈습니다.');
}

document.addEventListener('click',function(e){
  var tv=e.target.closest('[data-todo-view]');if(tv){state.ui.todoView=tv.dataset.todoView;save();render();return;}
  var el=e.target.closest('[data-tab],[data-goto],[data-filter],[data-act],[data-close]');
  if(!el)return;
  if(el.dataset.tab){state.ui.tab=el.dataset.tab;save();render();return;}
  if(el.dataset.goto){state.ui.tab=el.dataset.goto;if(el.dataset.filter)state.ui.taskFilter=el.dataset.filter;save();render();return;}
  if(el.dataset.filter&&!el.dataset.goto){state.ui.taskFilter=el.dataset.filter;save();render();return;}
  if(el.dataset.close&&e.target===el){closeModal();return;}
  var act=el.dataset.act,id=el.dataset.id,m=me();
  if(act==='submit'){closeModal();submitModal(id);}
  else if(act==='approve'){closeModal();reviewModal(id,'approved');}
  else if(act==='return'){closeModal();reviewModal(id,'returned');}
  else if(act==='detail')detailModal(id);
  else if(act==='start'){var t=task(id);t.status='doing';log(m.id,'assign','「'+t.title+'」 시작');save();render();}
  else if(act==='todo-new')todoNew(el.dataset.who);
  else if(act==='todo-open')todoOpen(id);
  else if(act==='todo-carry'){todoCarry(todoById(id));save();render();toast('오늘로 옮겼습니다.');}
  else if(act==='todo-carry-all'){var lateList=state.todos.filter(function(d){return d.date<today()&&!d.done&&(state.ui.todoWho==='all'||d.assigneeId===state.ui.todoWho);});lateList.forEach(todoCarry);save();render();toast(lateList.length+'건을 오늘로 옮겼습니다.');}
  else if(act==='todo-delete'){if(confirm('이 항목을 삭제할까요?')){state.todos=state.todos.filter(function(d){return d.id!==id;});save();closeModal();render();toast('삭제했습니다.');}}
  else if(act==='new-task')newTaskModal();
  else if(act==='new-lead')newLeadModal();
  else if(act==='test-notify'){var n=notify({type:'test',actorId:m.id});save();render();toast(n?'테스트 알림을 보냈습니다. 아래 발송 내역을 확인하세요.':'내 알림 채널이 꺼져 있습니다.');}
  else if(act==='reset'){if(confirm('데모 데이터를 초기 상태로 되돌릴까요? (알림 채널 설정도 지워집니다)')){state=seed();save();render();toast('초기화했습니다.');}}
});
document.addEventListener('submit',function(e){
  var f=e.target;e.preventDefault();var m=me();
  if(f.id==='todo-form'){var d=todoById(f.dataset.id),wasDone=d.done,oldWho=d.assigneeId;d.title=f.querySelector('#tf-title').value.trim();d.desc=f.querySelector('#tf-desc').value.trim();d.assigneeId=f.querySelector('#tf-who').value;d.date=f.querySelector('#tf-date').value||d.date;
    var nowDone=f.querySelector('#tf-done').checked;if(nowDone!==wasDone)todoSetDone(d,nowDone);
    if(d.assigneeId!==oldWho&&d.assigneeId!==m.id)notify({type:'todo.assigned',todo:d,actorId:m.id});
    save();closeModal();render();toast('저장했습니다.');}
  else if(f.id==='submit-form'){var t=task(f.dataset.id),fields={};TYPES[t.type].fields.forEach(function(fd){var el=f.elements[fd.k];fields[fd.k]=fd.t==='check'?!!el.checked:el.value.trim();});doSubmit(t.id,f.elements.summary.value.trim(),fields,f.elements.link.value.trim());}
  else if(f.dataset.quick){var q=f.querySelector('input');submitModal(f.dataset.quick,q.value.trim());}
  else if(f.id==='review-form'){doReview(f.dataset.id,f.dataset.decision,f.elements.comment.value.trim());}
  else if(f.id==='new-task-form'){var t2={id:uid(),title:f.querySelector('#nt-title').value.trim(),type:f.querySelector('#nt-type').value,assigneeId:f.querySelector('#nt-assignee').value,assignerId:m.id,client:f.querySelector('#nt-client').value.trim(),due:f.querySelector('#nt-due').value,priority:f.querySelector('#nt-pri').value,status:'todo',createdAt:new Date().toISOString()};
    state.tasks.unshift(t2);log(m.id,'assign','「'+t2.title+'」 '+uname(t2.assigneeId)+'에게 배정 (마감 '+fmtDate(t2.due)+')');notify({type:'task.assigned',task:t2,actorId:m.id});save();closeModal();render();toast('배정했습니다. '+uname(t2.assigneeId)+'에게 알림을 보냈습니다.');}
  else if(f.id==='new-lead-form'){var l={id:uid(),name:f.querySelector('#nl-name').value.trim(),phone:f.querySelector('#nl-phone').value.trim(),region:f.querySelector('#nl-region').value.trim(),kind:f.querySelector('#nl-kind').value.trim(),stage:'신규',assigneeId:f.querySelector('#nl-assignee').value,source:f.querySelector('#nl-source').value,createdAt:new Date().toISOString()};
    state.leads.unshift(l);log(m.id,'lead','새 문의 등록 · '+l.name+' ('+l.region+', '+l.kind+') — 담당 '+uname(l.assigneeId));notify({type:'lead.new',lead:l,actorId:m.id});save();closeModal();render();toast('문의를 등록했습니다.');}
  else if(f.id==='settings-form'){state.settings.discordWebhook=f.querySelector('#s-discord').value.trim();state.settings.telegramToken=f.querySelector('#s-tg-token').value.trim();state.settings.telegramChatId=f.querySelector('#s-tg-chat').value.trim();state.settings.notifyCeoOnHigh=f.querySelector('#s-ceo-high').checked;save();toast('알림 채널을 저장했습니다.');}
});
document.addEventListener('change',function(e){
  var el=e.target,m=me();
  if(el.id==='user-switch'){state.currentUserId=el.value;save();render();return;}
  if(el.hasAttribute('data-todo-who')){state.ui.todoWho=el.value;save();render();return;}
  if(el.dataset.todoChk){var dd=todoById(el.dataset.todoChk);var names=recipientsFor({type:'todo.done',todo:dd,actorId:m.id}).map(function(x){return user(x).name;}).join(', ');todoSetDone(dd,el.checked);save();render();toast(el.checked?'완료 처리'+(names?'. '+names+'에게 알림을 보냈습니다.':'.'):'완료를 해제했습니다.');return;}
  if(el.dataset.todoField){var d0=todoById(el.dataset.todo);var v=el.value;if(el.dataset.todoField!=='date')v=v.trim();if(d0[el.dataset.todoField]===v)return;var wasEmpty=!d0.title;d0[el.dataset.todoField]=v;
    if(el.dataset.todoField==='title'&&wasEmpty&&v){log(m.id,'assign','「'+v+'」 할 일 추가 ('+uname(d0.assigneeId)+')');if(d0.assigneeId!==m.id)notify({type:'todo.assigned',todo:d0,actorId:m.id});}
    save();if(el.dataset.todoField==='date')render();return;}
  if(el.dataset.leadStage){var l=lead(el.dataset.leadStage);l.stage=el.value;log(m.id,'lead',l.name+' 문의 단계 → '+l.stage);notify({type:'lead.stage',lead:l,actorId:m.id});save();render();toast('단계를 변경하고 알림을 보냈습니다.');return;}
  if(el.dataset.leadAssign){var l2=lead(el.dataset.leadAssign);l2.assigneeId=el.value;log(m.id,'lead',l2.name+' 문의 담당 → '+uname(l2.assigneeId));if(l2.assigneeId)notify({type:'task.assigned',task:{title:'문의 응대 · '+l2.name+' ('+l2.region+', '+l2.kind+')',type:'lead',due:dayOffset(1),priority:'normal',assigneeId:l2.assigneeId},actorId:m.id});save();render();return;}
  if(el.dataset.userField){user(el.dataset.user)[el.dataset.userField]=el.value.trim();save();return;}
  if(el.dataset.userCh){var u=user(el.dataset.user);var i=u.channels.indexOf(el.dataset.userCh);if(el.checked&&i<0)u.channels.push(el.dataset.userCh);if(!el.checked&&i>=0)u.channels.splice(i,1);save();return;}
});

document.getElementById('btn-out').addEventListener('click',function(){attend('out');});
function attend(kind){var k=today()+':'+state.currentUserId;var a=state.attendance[k]=state.attendance[k]||{};if(a[kind]){toast((kind==='in'?'출근':'퇴근')+' '+a[kind]+' 기록됨');return;}
  a[kind]=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});log(state.currentUserId,'assign',(kind==='in'?'출근':'퇴근')+' '+a[kind]);notify({type:'attendance',inout:kind,actorId:state.currentUserId});save();render();toast((kind==='in'?'출근':'퇴근')+' 기록 · #출퇴근 채널에 남겼습니다.');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&!e.shiftKey&&e.target.classList&&e.target.classList.contains('cell')&&e.target.tagName==='TEXTAREA'){e.preventDefault();var wasTitle=e.target.dataset.todoField==='title',val=e.target.value.trim(),tid=e.target.dataset.todo;e.target.blur();if(wasTitle&&val){var d=todoById(tid);todoNew(d.assigneeId);}}});
document.addEventListener('input',function(e){if(e.target.classList&&e.target.classList.contains('cell')&&e.target.tagName==='TEXTAREA')autosize(e.target);});

render();
})();
</script>
</body>
</html>
